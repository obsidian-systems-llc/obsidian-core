current_release: foundation-1
priorities:
  - id: CORE-001
    title: Monorepo and local development foundation
    status: done
    priority: 1
    dependencies: []
    acceptance_criteria:
      - Monorepo installs with one command
      - All applications pass lint and typecheck
      - Local PostgreSQL starts through documented tooling
      - Environment variables are validated
    implementation_notes: >-
      Node.js TypeScript monorepo with a backend-only Fastify Core API and native PostgreSQL 17
      local-development setup. No GUI applications are included; future Vercel-hosted applications
      must consume Core's authenticated APIs.
  - id: CORE-002
    title: Database schema foundation and migrations
    status: done
    priority: 2
    dependencies: [CORE-001]
    acceptance_criteria:
      - Foundation tables use immutable UUID identifiers and UTC timestamps
      - Migrations are deterministic, tracked, and fail safely on checksum drift
      - A real local PostgreSQL database can apply and validate the foundation migration
    implementation_notes: >-
      The PostgreSQL foundation migration defines the required identity, organization,
      authorization, entitlement, and audit tables. SQL migration checksums are recorded in
      schema_migrations and verified before every run.
  - id: CORE-003
    title: Structured logging, health checks, and audit framework
    status: done
    priority: 3
    dependencies: [CORE-002]
    acceptance_criteria:
      - Every request has a propagated or generated correlation ID
      - Health reports API and database readiness without leaking configuration
      - Audit-event helpers capture actor, action, target, correlation ID, timestamp, and approved metadata
    implementation_notes: >-
      Core API provides correlation-aware structured logging, liveness and database-readiness endpoints,
      and validated audit-event construction that rejects sensitive metadata.
  - id: CORE-004
    title: Central identity integration
    status: done
    priority: 4
    dependencies: [CORE-003]
    acceptance_criteria:
      - Core validates Auth0 RS256 bearer tokens against the provider JWKS, issuer, and configured audience
      - Protected routes reject missing, malformed, invalid, and wrong-audience bearer tokens with a stable unauthenticated error
      - Auth0 tenant configuration is validated at startup without requiring client secrets or management credentials
    implementation_notes: >-
      Auth0 OIDC discovery was verified for the development tenant. Core exposes a token-protected
      identity boundary and remains authoritative for profiles, application entitlements, roles,
      permissions, and resource-level authorization.
  - id: CORE-005
    title: Roles, permissions, and application entitlements
    status: done
    priority: 5
    dependencies: [CORE-004]
    acceptance_criteria:
      - Core resolves Auth0 identities to active internal users and evaluates current application entitlements and role permissions server-side
      - Protected application routes default to deny and return a stable forbidden error unless both an entitlement and permission are present
      - Authorization unit and real PostgreSQL integration tests cover allowed and denied access paths
    implementation_notes: >-
      Auth0 authentication remains separate from Core authorization. Initial authorization enforcement
      uses the core-admin application and authorization.read permission; role and entitlement management
      interfaces are deferred until their administration workflows are designed.
  - id: CORE-006
    title: Company, district, store, and department hierarchy
    status: done
    priority: 6
    dependencies: [CORE-005]
    acceptance_criteria:
      - Active organization, business unit, district, store, and department records are returned in parent hierarchy order
      - Hierarchy reads require a Core Admin entitlement and organization.read permission
      - Active parent lookup indexes and real PostgreSQL integration coverage support the hierarchy query
    implementation_notes: >-
      Organization read access is implemented before mutation workflows. Creation, changes,
      deactivation, and approval/audit controls require a dedicated administration workflow.
  - id: CORE-007
    title: Customer profiles and shared addresses
    status: done
    priority: 7
    dependencies: [CORE-006]
    acceptance_criteria:
      - Customer profiles and reusable addresses are separate from Auth0 identities and support shared account memberships
      - Customer profile and address payloads use authenticated application-layer encryption
      - Customer profile access requires application authorization and membership-scoped retrieval
  - id: CORE-008
    title: Employee profiles and store assignments
    status: done
    priority: 8
    dependencies: [CORE-006]
    acceptance_criteria:
      - Employee profiles are separate from Auth0 identities and encrypt their profile payloads with authenticated application-layer encryption
      - Employee assignments preserve effective store, department, and manager relationships without overwriting historical assignments
      - Employee self-service profile access requires employee-portal authorization and employee.profile.read, with allowed and denied coverage
    implementation_notes: >-
      SSNs, identity-document copies, payroll tax data, compensation data, employee writes, and
      administrative assignment workflows are deliberately deferred until their dedicated access,
      audit, retention, and compliance controls are designed.
  - id: CORE-009
    title: Timekeeping and immutable corrections
    status: done
    priority: 9
    dependencies: [CORE-008]
    acceptance_criteria:
      - Time entries record completed work intervals in UTC with retry-safe idempotency and no floating-point duration calculations
      - Corrections are immutable, require a reason, preserve the original entry, and create a safe audit event
      - Employees can read and create only their own time entries through employee-portal authorization, with allowed and denied coverage
    implementation_notes: >-
      This iteration records time for all employee classifications, including salaried staff, but
      does not calculate wages, overtime, or commissions. Those require effective-dated compensation
      plans and payroll policy in CORE-014.
  - id: CORE-010
    title: Product/service catalog and versioned quote engine
    status: done
    priority: 10
    dependencies: [CORE-006]
    acceptance_criteria:
      - Catalog item versions preserve effective dates and integer minor-unit prices without rewriting historical versions
      - Core creates idempotent quotes from active catalog versions and snapshots line prices, quantities, and pricing context
      - Quote creation is server-authorized and has allowed, denied, validation, and real-PostgreSQL coverage
    implementation_notes: >-
      This initial quote engine supports catalog-derived line items only. Taxes, discounts, store
      overrides, customer acceptance evidence, approvals, and manual overrides require separately
      designed policy and audit workflows.
  - id: CORE-011
    title: Jobs, appointments, and workflow state machine
    status: done
    priority: 11
    dependencies: [CORE-007, CORE-008, CORE-010]
    acceptance_criteria:
      - Jobs and appointment windows are Core records linked to customers, quotes, and employee assignments where supplied
      - Job state transitions are append-only, attributed, idempotent, and rejected unless allowed by the server workflow
      - Job creation and transition routes require separate Core Admin permissions with allowed and denied coverage
  - id: CORE-012
    title: Payment-provider capability spike and adapter contract
    status: done
    priority: 12
    dependencies: [CORE-005]
    acceptance_criteria:
      - Square sandbox, Payments, Catalog/Invoices/Subscriptions, idempotency, and signed-webhook requirements are verified from official documentation
      - Core defines a provider-neutral payment contract that accepts only provider tokens/references and integer minor-unit amounts
      - Production Square mode is rejected outside production, and no payment processing or webhook state mutation is enabled by this spike
    implementation_notes: >-
      Square is the interim provider. Verify Square sandbox, subscriptions, hosted or tokenized
      collection, webhooks, settlement reporting, refunds, terminals, and idempotency before any
      processor-specific implementation. Core, not any GUI, must own processor calls and payment-state
      finalization. Commerce360 remains deferred pending capability confirmation.
  - id: CORE-013
    title: Subscription model and $15/month protection-plan configuration
    status: done
    priority: 13
    dependencies: [CORE-007, CORE-010, CORE-012]
    acceptance_criteria:
      - Subscription plans and effective-dated versions preserve integer minor-unit price, cadence, and provider references
      - Customer subscriptions retain their selected plan version and lifecycle dates without storing payment credentials
      - Plan version creation requires executive-panel subscription.plan.manage authorization
  - id: CORE-014
    title: Commission engine with $20/hour plan and 10% default commission
    status: done
    priority: 14
    dependencies: [CORE-008, CORE-009, CORE-010, CORE-012]
  - id: CORE-015
    title: Store/district/company sales and wage aggregates
    status: done
    acceptance_criteria:
      - Daily store, district, and company aggregates distinguish sales and estimated workforce costs in integer minor units
      - Aggregate records preserve source status and refresh metadata rather than claiming finalized accounting data
      - Executive aggregate reads require executive-panel reporting.read authorization
    priority: 15
    dependencies: [CORE-006, CORE-009, CORE-014]
  - id: CORE-016
    title: Executive Panel authentication and overview
    status: done
    priority: 16
    dependencies: [CORE-005, CORE-015, CORE-026]
    acceptance_criteria:
      - Core exposes an Auth0-protected executive overview contract requiring executive-panel reporting.read authorization
      - Overview metrics are hierarchy-scoped, use persisted aggregate rows, and compare the latest reporting date with the prior available date
      - The contract keeps estimated workforce costs distinct from finalized payroll and is covered by API authorization and real-database tests
    implementation_notes: >-
      This is a Core API iteration only. The Vercel-hosted Executive Panel remains a separate client
      that consumes the authenticated overview and aggregate endpoints.
  - id: CORE-017
    title: Employee mobile clock and assigned-job integration
    status: done
    priority: 17
    dependencies: [CORE-009, CORE-011]
    acceptance_criteria:
      - Employee-mobile APIs return only the authenticated active employee's assigned jobs, appointment windows, and current workflow status
      - Mobile clock, break, and job-status commands are idempotent, append-only, server-authorized, and auditable; mobile retries never duplicate a business action
      - Mobile location collection is disabled by default; Core accepts no GPS data until a separately approved, consented, and retention-controlled location-verification policy exists
      - The API exposes conflict-safe failure behavior and is covered by allowed, denied, duplicate-request, and real-PostgreSQL tests
    implementation_notes: >-
      The future client is React Native with Expo using a dedicated Auth0 Native application and
      Core's REST API. No client application is required to complete this Core-owned integration.
      Route planning, navigation, and mapping remain deferred to CORE-025. The initial mobile
      contract deliberately avoids collecting location data, device fingerprints, or other
      sensitive telemetry.
  - id: CORE-018
    title: Customer portal integration
    status: blocked
    priority: 18
    dependencies: [CORE-007, CORE-011, CORE-013]
    acceptance_criteria:
      - Customer-portal APIs return only the authenticated customer's profile, shared addresses, devices, quotes, jobs, appointments, and subscription agreements through membership-scoped reads
      - Customer device, portal-read, and subscription-view records preserve ownership history, application-layer encryption where data is sensitive, authorization, pagination, audit requirements, and stable failure behavior
      - Payment-method references, invoices, payment collection, and payment-status finalization remain Core-owned and are exposed to the portal only after CORE-032 implements the signed Square lifecycle; no client-side processor integration is permitted
      - Every portal route is documented in the README and covered by allowed, denied, ownership-isolation, pagination, and real-PostgreSQL tests
    implementation_notes: >-
      The future portal is a Next.js application on Vercel using its own Auth0 application. Core
      owns the customer contract independently of that UI. This priority can implement all
      non-payment portal records and reads now; its payment-specific acceptance boundary is
      intentionally held open until CORE-032 rather than being represented by an unsafe placeholder.
      Resume CORE-018 immediately after CORE-032 to add customer payment-method references,
      invoices, receipts, payment status, and the final portal payment contract.
  - id: CORE-019
    title: Public website account and protection enrollment
    status: done
    priority: 19
    dependencies: [CORE-013]
    acceptance_criteria:
      - The public website can read Core-owned current Device Care enrollment terms without recreating plan price, cadence, or Repair Credit thresholds in a client application
      - Authenticated customer registration, saved-card collection, and enrollment reuse the existing Core customer-portal payment contract; no website-specific processor path or unauthenticated enrollment write is introduced
      - The public contract documents its public offer route, enrollment handoff, CORS requirements, stable failure behavior, and production payment-test dependency
    implementation_notes: >-
      The public website reads only the active Core-owned offer and hands authenticated customers
      to the existing customer-portal registration, Stripe SetupIntent, saved-method, and Device
      Care enrollment routes. The live Stripe transaction/webhook confirmation remains CORE-018 and
      CORE-032 validation work; it does not create a second public payment path.
  - id: CORE-020
    title: Payroll export integration
    status: blocked
    priority: 20
    dependencies: [CORE-009, CORE-014]
  - id: CORE-021
    title: Website invoices and retainer subscriptions
    status: proposed
    priority: 21
    dependencies: [CORE-007, CORE-012]
    implementation_notes: >-
      Support online-item checkout, website-service invoices, and configurable retainer subscriptions
      initiated by the Obsidian Systems website or Prospecting Engine. Core owns authorization,
      processor interactions, webhook handling, operational records, and final payment state.
  - id: CORE-022
    title: Automated subscription billing and dunning
    status: proposed
    priority: 22
    dependencies: [CORE-012, CORE-013, CORE-021]
    implementation_notes: >-
      Core tracks due dates, creates operational invoices, charges Square tokenized saved payment
      methods with customer authorization, processes signed webhooks, and runs idempotent configurable
      retries, grace periods, cancellations, and billing notifications. Customer applications consume
      subscription state and never charge cards or finalize payment state directly.
  - id: CORE-023
    title: Legacy identity and profile migration framework
    status: proposed
    priority: 23
    dependencies: [CORE-007, CORE-008]
    implementation_notes: >-
      Define source inventory, identity mapping, encryption requirements, validation, reconciliation,
      audit evidence, and rollback for Prospecting Engine and other backend customer or employee data.
      Do not import production data until the source schemas and retention obligations are reviewed.
  - id: CORE-024
    title: Sensitive employee identity documents and retention controls
    status: proposed
    priority: 24
    dependencies: [CORE-008]
    implementation_notes: >-
      Design the legally justified collection, encrypted object storage, dedicated permissions,
      access audit events, retention/deletion policy, and compliance review for SSNs, government
      identity documents, payroll tax data, and other highly sensitive employment records. Do not
      collect or migrate these values before that design is approved.
  - id: CORE-025
    title: Route planning and mapping provider adapter
    status: proposed
    priority: 25
    dependencies: [CORE-011]
    implementation_notes: >-
      Introduce Core-owned route and route-stop records plus a provider abstraction for geocoding,
      travel time, route optimization, and navigation deep links. Front-end applications render maps
      and navigation while Core retains dispatch decisions, provider secrets, and operational route data.
  - id: CORE-026
    title: Operational correctness and security hardening
    status: done
    priority: 15.5
    dependencies: [CORE-005, CORE-009, CORE-013, CORE-014, CORE-015]
    acceptance_criteria:
      - Reporting scope correctly resolves store and district aggregates through the organization hierarchy
      - Subscription plan version writes are atomic, auditable, and safe under concurrent requests
      - High-risk job, quote, compensation, and subscription writes emit safe audit events
      - Compensation and aggregate claims in the README match executable Core behavior and are covered by real database and authorization tests
    implementation_notes: >-
      Corrective priority created from the implementation review. No new Executive Panel feature
      work proceeds until these reliability and security gaps are resolved.
  - id: CORE-027
    title: Compensation assignment and commission lifecycle workflows
    status: done
    priority: 26
    dependencies: [CORE-014, CORE-026]
    acceptance_criteria:
      - Authorized administrative workflows create effective-dated compensation assignments without rewriting history
      - Commission generation, adjustment, and employee earnings reads are reproducible, authorized, and audited
      - Payroll estimates remain explicitly distinct from finalized payroll records
    implementation_notes: >-
      Created by CORE-026 because CORE-014 currently provides schema and calculation primitives,
      not employee-facing or administrative compensation and commission write workflows.
  - id: CORE-028
    title: API perimeter security controls
    status: done
    priority: 27
    dependencies: [CORE-004, CORE-005, CORE-026]
    acceptance_criteria:
      - Sensitive endpoints have documented rate limits, CORS policy, and step-up authentication requirements
      - Production security headers and allowed origins are configuration-validated and covered by API tests
    implementation_notes: >-
      Created by CORE-026 to turn the repository security baseline into executable API perimeter controls.
  - id: CORE-029
    title: Admin operations tree and customer communication routing
    status: done
    priority: 28
    dependencies: [CORE-005, CORE-006, CORE-007, CORE-008, CORE-028, CORE-037, CORE-038]
    acceptance_criteria:
      - Executives, administrators, managers, and employees receive distinct Core-admin/employee entitlements and least-privilege permissions that are enforceable by organization, store, department, and management assignment
      - Authorized administrative APIs create, change, deactivate, and audit organization hierarchy, customer, employee, assignment, and customer-to-repair linkage records without rewriting historical operational records
      - Customer-originated repair requests and actionable communications calls can be routed, claimed, reassigned, escalated, and completed through Core-owned manager and administrator workflows
      - Sensitive customer and employee writes preserve encryption, effective dates, idempotency, resource-level authorization, and audit history; customer-facing applications can read the linked repair status without receiving internal-only data
      - Every administrative and routing API is documented in the README integration reference and covered by allowed, denied, duplicate, and real-database tests
    implementation_notes: >-
      This parent priority is completed only after stages CORE-029-01 through CORE-029-05. Payroll
      export work (CORE-020), payment-provider-dependent work, and uncontrolled outbound campaigns
      remain deferred. Split independently deployable discoveries into proposed follow-up priorities
      rather than leaving business rules to dashboard applications.
  - id: CORE-029-01
    title: Admin access-governance tree
    status: done
    priority: 28.01
    dependencies: [CORE-005, CORE-028]
    acceptance_criteria:
      - Step-up-authenticated Core administrators can create and manage application-scoped roles, role permissions, effective-dated user role assignments, and application entitlements through audited APIs
      - Role, permission, and application-access changes require explicit `authorization.manage`, verified step-up authentication, idempotency, audit history, and self-access changes are forbidden
      - The Core-admin, employee-portal, executive-panel, and customer-portal boundaries remain default-deny and their administrative contracts have allowed, denied, duplicate, and expiry coverage
  - id: CORE-029-02
    title: Employee, manager, and organizational administration
    status: done
    priority: 28.02
    dependencies: [CORE-029-01, CORE-006, CORE-008]
    acceptance_criteria:
      - Authorized administrators manage encrypted employee lifecycle data and effective-dated store, department, and manager assignments
      - Managers can access only the employees and work routed within their active organizational scope
  - id: CORE-029-03
    title: Customer and repair administration
    status: done
    priority: 28.03
    dependencies: [CORE-029-01, CORE-007, CORE-010]
    acceptance_criteria:
      - Authorized staff can create and update customer records and link, relink, or remove the customer association of a repair with immutable audit history
      - Customer portals expose linked repair status without revealing employee-only notes or operational data
  - id: CORE-029-04
    title: Customer communication routing and escalation
    status: done
    priority: 28.04
    dependencies: [CORE-029-01, CORE-029-02, CORE-029-03, CORE-037, CORE-038]
    acceptance_criteria:
      - Online repair requests and communications calls support scoped routing, manager reassignment, escalation, follow-up ownership, and auditable completion
      - Notifications represent actionable customer work and do not disclose restricted customer data beyond the recipient's scope
  - id: CORE-029-05
    title: Admin operations contract and readiness audit
    status: done
    priority: 28.05
    dependencies: [CORE-029-01, CORE-029-02, CORE-029-03, CORE-029-04]
    acceptance_criteria:
      - The README and generated client contract document every administrative and routing route, authorization rule, request, response, and failure code
      - End-to-end authorization, tenancy/scope, audit, migration, and repair-visibility tests validate the complete operations tree
  - id: CORE-030
    title: Quote approval, customer acceptance, and revision workflows
    status: done
    priority: 29
    dependencies: [CORE-010, CORE-028]
    acceptance_criteria:
      - Quote revisions, approvals, overrides, customer acceptance evidence, expiry, and cancellation preserve immutable pricing history
      - Sensitive approvals and overrides require authorization, step-up where configured, and audit evidence
  - id: CORE-031
    title: Aggregate refresh and operational reconciliation
    status: proposed
    priority: 30
    dependencies: [CORE-009, CORE-014, CORE-015, CORE-027]
    acceptance_criteria:
      - An idempotent Core-owned refresh workflow derives daily aggregates from authoritative operational records
      - Aggregate values reconcile to documented sources and retain refresh/audit metadata
  - id: CORE-032
    title: Square payment and webhook production integration
    status: in_progress
    priority: 31
    dependencies: [CORE-012, CORE-028]
    acceptance_criteria:
      - Core performs token/reference-based Square payment, refund, invoice, and webhook workflows with idempotency and signature/replay protection
      - Payment lifecycle state, audit history, and provider references are reconciled without storing card credentials
    implementation_notes: >-
      Square payment, refund, signed webhook, replay-ledger, safe-reference, and audit foundations
      are implemented. Square invoice workflows and recurring subscription synchronization require
      verified Square Catalog/Invoice provisioning and are tracked by CORE-021 and CORE-022. The
      Worldpay/Commerce360 configuration remains selectable through PAYMENT_PROCESSOR but is
      intentionally disabled until provider-issued credentials, signed-webhook details, and sandbox
      verification are available. When Stripe is selected, the customer cancellation boundary also
      resolves a stored historical Square agreement through a separately configured, server-only
      Square adapter; the portal never selects or calls a payment provider. After CORE-032 is done,
      return to CORE-018 and review CORE-019,
      CORE-021, and CORE-022 for their provider-dependent finalization work.
  - id: CORE-033
    title: Authorization administration and access-governance workflows (superseded by CORE-029-01)
    status: proposed
    priority: 32
    dependencies: [CORE-005, CORE-028]
    acceptance_criteria:
      - Authorized administrators can manage roles, permissions, and entitlements through audited, effective-dated APIs
      - Role and entitlement changes require step-up authentication where configured and cannot grant unchecked access
    implementation_notes: >-
      Consolidated into CORE-029-01 so access administration is delivered as the foundation of the
      broader admin operations tree rather than as a disconnected integration.
  - id: CORE-034
    title: Versioned API contract and generated-client pipeline
    status: proposed
    priority: 33
    dependencies: [CORE-028]
    acceptance_criteria:
      - A machine-readable, versioned contract covers every externally callable Core endpoint, authorization requirement, input, response, and stable error code
      - Contract tests prevent undocumented route or schema drift and generated client packages are published for Obsidian applications
      - Breaking changes are versioned deliberately and migration guidance is documented
    implementation_notes: >-
      After CORE-032 is complete, return to CORE-018 to finalize the customer-portal payment
      integrations. Before closing CORE-032, review every blocked or proposed payment-dependent
      CORE priority (including CORE-019, CORE-021, and CORE-022), update its dependencies and
      acceptance criteria for the verified provider capabilities, and resume it rather than leaving
      payment behavior to a client application.
      Square is the active implementation target because its configuration is available locally.
      Keep the Worldpay/Commerce360 adapter selectable through PAYMENT_PROCESSOR but disabled from
      live processing until provider-issued credentials, webhook onboarding, and sandbox/production
      verification are complete.
      Created by the production-readiness documentation audit. The README is the human integration
      guide; a validated, generated contract is required to prevent client drift as Core grows.
  - id: CORE-035
    title: Production deployment durability and observability
    status: proposed
    priority: 34
    dependencies: [CORE-003, CORE-028]
    acceptance_criteria:
      - Deployment runbooks define managed secrets, HTTPS, database backup and restore verification, health monitoring, and safe migration rollout/rollback
      - Horizontally scaled Core deployments use a shared rate-limit store and preserve correlation-aware redacted logging
      - Operational alerts and a recovery drill validate readiness, database failure behavior, and migration recovery
    implementation_notes: >-
      Created by the production-readiness documentation audit. The current in-process limiter is
      correct only for a single Core instance; no production deployment or observability stack has
      been implemented yet.
  - id: CORE-036
    title: Obsidian Device Care credit ledger and benefit entitlements
    status: done
    priority: 35
    dependencies: [CORE-013, CORE-030, CORE-032]
    acceptance_criteria:
      - Active Device Care payments create idempotent, append-only Repair Credit ledger entries in integer minor units; the available balance becomes usable at $60 and never exceeds the configured $350 cap
      - Core derives and authorizes MAX Status and all configured benefit entitlements, including three-month cleaning intervals and the 90-day workmanship warranty, from a versioned membership policy rather than client logic
      - Credit application requires verified active membership, eligible repair/device, auditable immediate-household relationship, and traceable reversal/adjustment behavior
      - Lapse, grace, forfeiture, and reinstatement behavior is configurable, authorized, auditable, and never deletes historical credit records
      - Customer and administrative APIs expose only Core-calculated balances, eligibility, and benefit-redemption state with pagination, authorization, audit coverage, and documented contracts
    implementation_notes: >-
      Authoritative business policy: $15/month Device Care accrues Repair Credits; credits unlock at
      $60, cap at $350, and MAX Status applies at the cap while active. Member discounts, household
      usage, MAX benefits, and replenishment after credits are spent are documented in README and
      ADR-0021. The approved policy grants seven days of delinquency grace, appends forfeiture on
      day eight, and never restores forfeited credits after renewal. Signed Square and Stripe invoice accrual, replay-safe ledger
      entries, and the customer wallet read contract are implemented as a safe foundation. Stripe
      recognizes both its legacy Invoice subscription field and its current parent subscription
      details representation. The entitlement migration adds immutable credit applications linked
      to accepted quote/repair records, verified immediate-household relationships, MAX benefit-use
      records, staff read/write routes, replay-safe credit-adjustment commands, and step-up
      executive policy-version commands are implemented. Production lifecycle testing remains part
      of routine payment/webhook monitoring, but the Core-owned contract is complete.
  - id: CORE-037
    title: Communications architecture and Retell AI call integration
    status: done
    priority: 36
    dependencies: [CORE-005, CORE-007, CORE-008, CORE-028]
    acceptance_criteria:
      - Retell webhooks are raw-body signature verified, replay-safe, auditable, and create Core-owned call records
      - Authorized employee and management APIs provide an actionable call inbox, detail, atomic claim, and assignment workflows
      - Call analysis is treated as untrusted input and actionable follow-up notifications are created only after provider-confirmed post-call analysis
    implementation_notes: >-
      Phase 1 covers Retell configuration, signed call_started/call_ended/call_analyzed handling,
      call records, analysis/transcript storage, incoming/outgoing state, assignment, and actionable
      notification. CRM, outbound campaigns, DNC, repair conversion, and live agent tools remain
      separately staged to avoid uncontrolled calling or unauthorized information disclosure.
  - id: CORE-038
    title: Communications call-to-workflow conversion
    status: done
    priority: 37
    dependencies: [CORE-037, CORE-007, CORE-008]
    acceptance_criteria:
      - Inbound calls match active customer profiles through a protected exact-phone lookup without decrypting profiles at webhook time
      - Authorized employees can create reviewed, idempotent repair jobs and encrypted leads from calls without trusting AI analysis as authoritative input
      - Core records auditable do-not-call suppression independently of Retell so future outbound work can enforce it
    implementation_notes: >-
      The Phase 2 workflow is intentionally write-first. Campaigns, CSV imports, outbound initiation,
      lead reads/pipeline, scheduled follow-up due dates, and live Retell functions remain separate
      priorities so they can receive their own authorization, consent, and operational contracts.
  - id: CORE-039
    title: Communications outbound campaigns and lead operations
    status: proposed
    priority: 38
    dependencies: [CORE-038]
    acceptance_criteria:
      - Authorized CRM APIs safely read and manage encrypted communications leads, dispositions, ownership, and follow-up dates
      - Campaign and CSV lead-import workflows enforce Core-managed do-not-call suppression before any outbound work is queued
      - Retell outbound initiation is idempotent, metadata-linked to Core records, auditable, and does not enable uncontrolled bulk calling
    implementation_notes: >-
      Add the campaign queue, consent/suppression preflight, lead pipeline, CSV validation, and Retell
      outbound adapter only after the operational owner, call-volume safeguards, and required Retell
      outbound configuration are established.
  - id: CORE-040
    title: Customer transactional email delivery and Device Care receipts
    status: done
    priority: 39
    dependencies: [CORE-007, CORE-018, CORE-032, CORE-036]
    acceptance_criteria:
      - Resend is a backend-only, configuration-validated transactional email adapter; no provider credential or email-delivery authority is exposed to applications.
      - Customer profile updates create one auditable, idempotent confirmation delivery record addressed to the authenticated account email without storing profile values in the email payload.
      - A replay-safe successful Device Care invoice payment creates one durable receipt delivery record containing the subscription's immutable amount, currency, provider invoice reference, and payment time; sandbox receipts are suppressed unless explicitly enabled.
      - Delivery attempts preserve provider references, redacted failures, retry state, and a Core-owned audit trail; an email-provider failure never rolls back the customer or payment operation.
      - README documents setup, environment variables, operational behavior, and relevant delivery failure handling; adapter, queue, and integration tests cover success, duplicate, failure, and sandbox behavior.
  - id: CORE-041
    title: Owner-controlled workforce account invitations
    status: done
    priority: 40
    dependencies: [CORE-005, CORE-029-01, CORE-040]
    acceptance_criteria:
      - A step-up-authenticated Core administrator with the dedicated invitation permission can issue, list, revoke, and resend email-specific application-role invitations without creating unclaimed access.
      - An invite recipient must authenticate with Auth0 using the invited email before Core creates or links the identity and grants the invitation's application entitlement and role assignment exactly once.
      - Invitation tokens are high-entropy, stored only as a hash plus encrypted retry material, expire, are revocable, and are never logged or returned by the Core API.
      - Invitation delivery uses the server-only Resend configuration, durable retries, provider idempotency, audit events, and no frontend secret.
      - README and API contract document Auth0 claim setup, routes, authorization, request/response/failure behavior, and operational configuration; unit and PostgreSQL integration tests cover authorization, replay, mismatch, expiry, revocation, and delivery failure.
  - id: CORE-042
    title: Stripe payment-provider adapter and portable application contract
    status: done
    priority: 41
    dependencies: [CORE-012, CORE-013, CORE-018, CORE-032, CORE-036]
    acceptance_criteria:
      - PAYMENT_PROCESSOR selects Square or Stripe without exposing secret processor credentials to an application and without rewriting historical provider references.
      - Stripe test and production payment, refund, saved-method, Device Care subscription, and signed webhook paths follow Core's existing authorization, idempotency, audit, and durable lifecycle conventions.
      - Browser applications save Stripe cards only through a Core-created SetupIntent and a Stripe.js-confirmed short-lived client secret; Core never stores raw card data.
      - Stripe invoice and subscription lifecycle events replay-safely reconcile Core state and Device Care credit/receipt behavior.
      - README, environment sample, ADR, migration, route reference, and provider/unit/integration coverage document the portable client contract and safe operational setup.
    implementation_notes: >-
      Stripe is becoming the preferred online processor due to its Bluevine settlement account.
      Square remains selectable for existing operations. Core does not automatically migrate saved
      cards, subscriptions, or customer consent between processors; that requires an explicit
      customer re-consent/migration priority before switching existing active subscriptions.
  - id: CORE-043
    title: Commerce catalog, inventory, orders, and fulfillment-provider integration
    status: proposed
    priority: 42
    dependencies: [CORE-010, CORE-028, CORE-042]
    acceptance_criteria:
      - Core evolves its existing effective-dated catalog into a full itemized commerce catalog for refurbished devices, accessories, apparel, parts, services, and other merchandise without creating a separate storefront source of truth.
      - Authorized administrative APIs manage products, variants/SKUs, condition, media references, categories, tags, online visibility, taxability, store availability, inventory locations, stock adjustments, reservations, and immutable price/cost history with audit records and concurrency-safe inventory control.
      - Customer/public read APIs expose only explicitly published, sellable products and safe inventory availability; they support pagination, filters, search, product detail, variants, images, and stable availability semantics without revealing cost, supplier data, or internal notes.
      - Core owns carts, orders, fulfillment, returns, refunds, pickup/shipping selections, order history, and payment-state reconciliation through the selected provider adapter; client applications never calculate authoritative prices, decrement stock, or finalize payment state.
      - A provider-neutral supplier/fulfillment boundary persists external product, variant, order, shipment, and webhook references separately from Core records. Printful is the initial supported print-on-demand adapter, using server-only scoped credentials, product/variant synchronization, order submission, idempotent signed-or-verified webhook handling, shipment tracking, and failure reconciliation.
      - Supplier price or availability imports from WGP and Injured Gadgets are not implemented until each provider supplies official API credentials, permitted data-use terms, rate limits, authentication, webhook/polling capability, and a stable test workflow. The adapter boundary must allow those providers to be added without coupling their data to storefront clients.
      - Product, inventory, order, fulfillment, payment, authorization, webhook, concurrency, migration, and provider-adapter behavior has unit, real-PostgreSQL integration, and contract coverage; README documents every route, permission, provider configuration, reconciliation behavior, and operational runbook.
    implementation_notes: >-
      Printful's current official API supports scoped private/OAuth access to store products,
      sync products/variants, orders, and webhooks. Store its token only in managed Core server
      secrets and treat Printful as a fulfillment provider, not the authoritative commerce record.
      Core remains authoritative for published assortment, customer-visible price, inventory
      reservation, order lifecycle, payment state, and audit history. Product imports must be
      reviewable before publication: do not automatically expose a Printful product or any future
      supplier item to customers, and do not trust provider pricing as Obsidian's selling price.
      WGP and Injured Gadgets are prospective parts/supplier adapters pending written provider
      approval and official documentation; no scraping or unsupported automation is authorized.
  - id: CORE-044
    title: Core-owned identity, credential, and session system
    status: in_progress
    priority: 43
    dependencies: [CORE-003, CORE-005, CORE-007, CORE-028, CORE-040, CORE-041]
    acceptance_criteria:
      - Core provides a secure, rate-limited email/password registration, email-verification, login, logout, password-reset, session-revocation, and account-recovery contract without storing plaintext or reversibly encrypted passwords.
      - Password credentials use Argon2id with versioned parameters and unique salts; verification/reset/session secrets are random, short-lived where appropriate, stored only as hashes, replay-safe, and never logged or returned after issuance.
      - Browser and mobile clients use Core-issued short-lived access tokens and rotating, server-tracked refresh/session credentials; authorization remains Core-owned and all sensitive account actions are audited.
      - Customer signup collects Core-owned encrypted profile data in the same idempotent onboarding flow, while workforce access continues to require owner-controlled invitations and verified email possession.
      - Step-up authentication for administrative and financial actions is implemented through a Core-owned MFA-ready mechanism; ordinary password authentication alone cannot satisfy step-up policy.
      - Existing Auth0 identities remain valid during an explicit, reversible migration window. Core supports a user-controlled reauthentication/linking path but never transfers, imports, or exposes Auth0 passwords.
      - README, migration/rollback runbook, environment documentation, API contract, abuse controls, security tests, and real-PostgreSQL integration coverage document the complete local-identity system before any portal stops using Auth0.
    implementation_notes: >-
      This priority supersedes Auth0 as the long-term identity provider after repeated callback,
      token-claim, and customer-onboarding operational failures. The selected architecture is an
      internal Core Identity module within the Node.js modular monolith, not a per-portal auth
      library. It will issue Core-verifiable credentials and preserve Core's separate customer,
      employee, entitlement, role, audit, and encryption boundaries. Keycloak deployment work is
      not a dependency and must not be used for production authentication. CORE-030 was returned
      to proposed status before deployment; its local, unfinished quote-lifecycle work remains
      uncommitted and must be completed or cleanly reverted in its own iteration.
  - id: CORE-045
    title: Stripe thin-event reconciliation adapter
    status: proposed
    priority: 44
    dependencies: [CORE-042, CORE-036]
    acceptance_criteria:
      - Core verifies a separately configured Stripe thin-event destination and retrieves the authoritative event and related Stripe resource before any durable state change.
      - Thin event processing remains replay-safe, records retrieval failures for retry, and cannot create a Repair Credit ledger entry from an incomplete event envelope.
      - README documents the independent signing secret, endpoint contract, reconciliation behavior, and operational migration from snapshot destinations.
    implementation_notes: >-
      Current production credit and receipt processing uses Stripe snapshot events. Thin events are
      intentionally not routed to the snapshot handlers until a current official retrieval contract,
      separate endpoint signing secret, replay policy, and production validation are implemented.
